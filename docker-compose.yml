services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mthl-procurement-risk:0.1.0
    init: true
    environment:
      MTHL_MODEL_PATH: ${MTHL_MODEL_PATH:-/app/artifacts/demo_model.joblib}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
